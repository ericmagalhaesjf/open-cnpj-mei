name: Atualizar dataset Juiz de Fora

on:
  schedule:
    - cron: '0 2 1 * *' # 02:00 UTC no dia 1 de cada mês
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Baixar receita.json.gz (exemplo)
        run: |
          curl -L "https://opencnpj.s3.amazonaws.com/receita.json.gz" -o receita.json.gz
          gunzip -f receita.json.gz

      - name: Filtrar Juiz de Fora e campos essenciais
        run: |
          # Ajuste o campo de município conforme o schema (ex: "municipio")
          jq -c 'select(.municipio == "Juiz de Fora" and .uf == "MG") | {cnpj:.cnpj, razao_social:.razao_social, nome:.nome, cnae:.cnae, municipio:.municipio, uf:.uf, simples:.simples, natureza_juridica:.natureza_juridica, situacao_cadastral:.situacao_cadastral, logradouro:.logradouro, numero:.numero, bairro:.bairro}' receita.json > dados-juiz-de-fora.ndjson
          # Converter NDJSON para array JSON (limitando tamanho se necessário)
          jq -s '.' dados-juiz-de-fora.ndjson > dados-juiz-de-fora.json
          # opcional: reduzir para primeiros N registros para evitar grandes commits
          # jq '.[0:5000]' dados-juiz-de-fora.json > dados-juiz-de-fora.json.tmp && mv dados-juiz-de-fora.json.tmp dados-juiz-de-fora.json

      - name: Commit e push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add dados-juiz-de-fora.json
          git commit -m "Atualização automática: dados-juiz-de-fora.json" || echo "Sem alterações"
          git push
