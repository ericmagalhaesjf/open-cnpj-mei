name: Atualizar Dataset MEI

on:
  schedule:
    - cron: '0 0 1 * *'   # roda todo dia 1 do mês
  workflow_dispatch:       # permite rodar manualmente também

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v3

      - name: Baixar dataset Receita
        run: |
          curl -L "https://opencnpj.s3.amazonaws.com/receita.json.gz" -o receita.json.gz
          gunzip -f receita.json.gz
          mv receita.json dados.json

      - name: Commit e push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add dados.json
          git commit -m "Atualização automática do dataset Receita"
          git push
