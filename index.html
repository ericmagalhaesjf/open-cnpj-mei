<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta de CNPJ - MEI</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Consulta de CNPJ - MEI</h1>
  <form id="formPesquisa" class="form">
    <div class="campo">
      <label for="cnpj">CNPJ</label>
      <input id="cnpj" name="cnpj" placeholder="Digite o CNPJ" required />
    </div>
    <div class="actions">
      <button type="submit">🔍 Pesquisar</button>
    </div>
  </form>

  <p id="status"></p>
  <div id="resultado"></div>
  <canvas id="grafico"></canvas>

  <script src="script.js"></script>
</body>
</html>
