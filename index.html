<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta MEI - OpenCNPJ + IBGE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src *; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net https://servicodados.ibge.gov.br https://api.opencnpj.org;">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Consulta de MEIs</h1>
  <form id="formPesquisa" class="form">
    <div class="campo">
      <label for="cnpj">CNPJ</label>
      <input id="cnpj" name="cnpj" placeholder="Digite o CNPJ" />
    </div>
    <div class="campo">
      <label for="estado">Estado (UF)</label>
      <select id="estado" name="estado"></select>
    </div>
    <div class="campo">
      <label for="cidade">Cidade</label>
      <select id="cidade" name="cidade"></select>
    </div>
    <div class="campo">
      <label for="cnae">CNAE</label>
      <select id="cnae" name="cnae"></select>
    </div>
    <div class="actions">
      <button type="submit">🔍 Pesquisar</button>
    </div>
  </form>

  <p id="status"></p>
  <ul id="resultado"></ul>
  <canvas id="grafico"></canvas>

  <footer>
    <p>Desenvolvido por <strong>Eric Magalhães</strong> • Juiz de Fora - MG</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
