<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consulta MEI por CNAE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Consulta de MEIs por CNAE</h1>
  <form id="formPesquisa" class="form">
    <div class="campo">
      <label for="cidade">Cidade</label>
      <input id="cidade" name="cidade" placeholder="Digite a cidade" required />
    </div>
    <div class="campo">
      <label for="estado">Estado (UF)</label>
      <input id="estado" name="estado" placeholder="Ex: MG" maxlength="2" required />
    </div>
    <div class="campo">
      <label for="cnae">CNAE</label>
      <input id="cnae" name="cnae" placeholder="Digite o CNAE" required />
    </div>
    <div class="actions">
      <button type="submit">🔍 Pesquisar</button>
    </div>
  </form>

  <p id="status"></p>
  <div id="resultado"></div>
  <canvas id="grafico"></canvas>

  <footer>
    <p>Desenvolvido por <strong>Eric Magalhães</strong> • Juiz de Fora - MG</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
